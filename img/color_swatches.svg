<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="340" rx="8" fill="#282C34"/>

  <!-- Column 1 -->
  <g transform="translate(24, 24)">
    <!-- background -->
    <rect x="0" y="0" width="28" height="28" rx="4" fill="#282C34" stroke="#4B5263" stroke-width="1"/>
    <text x="40" y="14" fill="#ABB2BF" font-size="13" font-weight="600">background</text>
    <text x="40" y="29" fill="#5C6370" font-size="11" font-family="monospace">#282C34</text>
    <!-- foreground -->
    <rect x="0" y="44" width="28" height="28" rx="4" fill="#ABB2BF"/>
    <text x="40" y="58" fill="#ABB2BF" font-size="13" font-weight="600">foreground</text>
    <text x="40" y="73" fill="#5C6370" font-size="11" font-family="monospace">#ABB2BF</text>
    <!-- red -->
    <rect x="0" y="88" width="28" height="28" rx="4" fill="#E06C75"/>
    <text x="40" y="102" fill="#ABB2BF" font-size="13" font-weight="600">red</text>
    <text x="40" y="117" fill="#5C6370" font-size="11" font-family="monospace">#E06C75</text>
    <!-- green -->
    <rect x="0" y="132" width="28" height="28" rx="4" fill="#98C379"/>
    <text x="40" y="146" fill="#ABB2BF" font-size="13" font-weight="600">green</text>
    <text x="40" y="161" fill="#5C6370" font-size="11" font-family="monospace">#98C379</text>
    <!-- yellow -->
    <rect x="0" y="176" width="28" height="28" rx="4" fill="#E5C07B"/>
    <text x="40" y="190" fill="#ABB2BF" font-size="13" font-weight="600">yellow</text>
    <text x="40" y="205" fill="#5C6370" font-size="11" font-family="monospace">#E5C07B</text>
    <!-- blue -->
    <rect x="0" y="220" width="28" height="28" rx="4" fill="#61AFEF"/>
    <text x="40" y="234" fill="#ABB2BF" font-size="13" font-weight="600">blue</text>
    <text x="40" y="249" fill="#5C6370" font-size="11" font-family="monospace">#61AFEF</text>
    <!-- purple -->
    <rect x="0" y="264" width="28" height="28" rx="4" fill="#C678DD"/>
    <text x="40" y="278" fill="#ABB2BF" font-size="13" font-weight="600">purple</text>
    <text x="40" y="293" fill="#5C6370" font-size="11" font-family="monospace">#C678DD</text>
  </g>

  <!-- Column 2 -->
  <g transform="translate(264, 24)">
    <!-- cyan -->
    <rect x="0" y="0" width="28" height="28" rx="4" fill="#56B6C2"/>
    <text x="40" y="14" fill="#ABB2BF" font-size="13" font-weight="600">cyan</text>
    <text x="40" y="29" fill="#5C6370" font-size="11" font-family="monospace">#56B6C2</text>
    <!-- dark_red -->
    <rect x="0" y="44" width="28" height="28" rx="4" fill="#BE5046"/>
    <text x="40" y="58" fill="#ABB2BF" font-size="13" font-weight="600">dark_red</text>
    <text x="40" y="73" fill="#5C6370" font-size="11" font-family="monospace">#BE5046</text>
    <!-- dark_yellow -->
    <rect x="0" y="88" width="28" height="28" rx="4" fill="#D19A66"/>
    <text x="40" y="102" fill="#ABB2BF" font-size="13" font-weight="600">dark_yellow</text>
    <text x="40" y="117" fill="#5C6370" font-size="11" font-family="monospace">#D19A66</text>
    <!-- white -->
    <rect x="0" y="132" width="28" height="28" rx="4" fill="#ABB2BF"/>
    <text x="40" y="146" fill="#ABB2BF" font-size="13" font-weight="600">white</text>
    <text x="40" y="161" fill="#5C6370" font-size="11" font-family="monospace">#ABB2BF</text>
    <!-- black -->
    <rect x="0" y="176" width="28" height="28" rx="4" fill="#282C34" stroke="#4B5263" stroke-width="1"/>
    <text x="40" y="190" fill="#ABB2BF" font-size="13" font-weight="600">black</text>
    <text x="40" y="205" fill="#5C6370" font-size="11" font-family="monospace">#282C34</text>
    <!-- comment_grey -->
    <rect x="0" y="220" width="28" height="28" rx="4" fill="#5C6370"/>
    <text x="40" y="234" fill="#ABB2BF" font-size="13" font-weight="600">comment_grey</text>
    <text x="40" y="249" fill="#5C6370" font-size="11" font-family="monospace">#5C6370</text>
    <!-- gutter_fg_grey -->
    <rect x="0" y="264" width="28" height="28" rx="4" fill="#4B5263"/>
    <text x="40" y="278" fill="#ABB2BF" font-size="13" font-weight="600">gutter_fg_grey</text>
    <text x="40" y="293" fill="#5C6370" font-size="11" font-family="monospace">#4B5263</text>
  </g>

  <!-- Column 3 -->
  <g transform="translate(504, 24)">
    <!-- cursor_grey -->
    <rect x="0" y="0" width="28" height="28" rx="4" fill="#2C323C" stroke="#4B5263" stroke-width="1"/>
    <text x="40" y="14" fill="#ABB2BF" font-size="13" font-weight="600">cursor_grey</text>
    <text x="40" y="29" fill="#5C6370" font-size="11" font-family="monospace">#2C323C</text>
    <!-- visual_grey -->
    <rect x="0" y="44" width="28" height="28" rx="4" fill="#3E4452"/>
    <text x="40" y="58" fill="#ABB2BF" font-size="13" font-weight="600">visual_grey</text>
    <text x="40" y="73" fill="#5C6370" font-size="11" font-family="monospace">#3E4452</text>
    <!-- menu_grey -->
    <rect x="0" y="88" width="28" height="28" rx="4" fill="#3E4452"/>
    <text x="40" y="102" fill="#ABB2BF" font-size="13" font-weight="600">menu_grey</text>
    <text x="40" y="117" fill="#5C6370" font-size="11" font-family="monospace">#3E4452</text>
    <!-- special_grey -->
    <rect x="0" y="132" width="28" height="28" rx="4" fill="#3B4048"/>
    <text x="40" y="146" fill="#ABB2BF" font-size="13" font-weight="600">special_grey</text>
    <text x="40" y="161" fill="#5C6370" font-size="11" font-family="monospace">#3B4048</text>
    <!-- vertsplit -->
    <rect x="0" y="176" width="28" height="28" rx="4" fill="#3E4452"/>
    <text x="40" y="190" fill="#ABB2BF" font-size="13" font-weight="600">vertsplit</text>
    <text x="40" y="205" fill="#5C6370" font-size="11" font-family="monospace">#3E4452</text>
  </g>
</svg>
